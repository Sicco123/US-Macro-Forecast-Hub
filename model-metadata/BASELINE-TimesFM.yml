team_model_designation: hub_baseline
methods: Zero-shot independent-series TimesFM 2.5 forecasts of the full FRED-MD panel, followed by extraction
  of INDPRO, CPIAUCSL, PCEPI, and UNRATE.
methods_long: Checkpoint google/timesfm-2.5-200m-pytorch; FoundationForecast 0.1.10. No fine-tuning. All
  126 FRED-MD variables are forecast independently; up to 512 transformed monthly observations before
  each origin. Auxiliary variables use official FRED-MD transformation codes. Hub targets use monthly
  log differences for INDPRO/CPIAUCSL/PCEPI and first differences for UNRATE. Forecast all variables for
  24 months, then extract the four hub targets; mean and five quantiles, seed 0. Requested tail quantiles
  outside the native knots are clamped by FoundationForecast. Native preprocessing interpolates missing
  auxiliary values within the historical input window. Historical forecasts use revised observations and
  may overlap model pretraining; they are retrospective comparisons.
data_inputs: Full FRED-MD monthly panel (126 variables); four hub targets extracted after forecasting
