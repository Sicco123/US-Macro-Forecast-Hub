team_model_designation: hub_baseline
methods: Zero-shot Chronos forecasts via FoundationForecast, using monthly log changes
  for INDPRO/CPIAUCSL/PCEPI and first differences for UNRATE.
methods_long: Checkpoint amazon/chronos-2; FoundationForecast 0.1.10. No fine-tuning.
  Last 512 transformed monthly observations before each origin; 24 horizons, five
  required quantiles, seed 0. Its point output is a median; no mean rows are submitted.
  Isolated missing level months are forward-filled before differencing. Historical forecasts use revised data and may overlap foundation-model pretraining;
  they are retrospective benchmarks, not real-time out-of-sample claims.
  Existing hub results used independent forecasts of the four targets. The corrected
  runner jointly forecasts the full FRED-MD panel before extracting those targets;
  existing historical results have not yet been regenerated with that runner.
data_inputs: FRED-MD monthly dataset (target indicators only)
