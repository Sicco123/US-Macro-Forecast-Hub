team_model_designation: hub_baseline
methods: Zero-shot multivariate Toto forecasts of the full FRED-MD panel, followed by extraction of INDPRO,
  CPIAUCSL, PCEPI, and UNRATE.
methods_long: Checkpoint Datadog/Toto-Open-Base-1.0; FoundationForecast 0.1.10. No fine-tuning. All 126
  FRED-MD variables share one attention group; up to 512 transformed monthly observations before each
  origin. Auxiliary variables use official FRED-MD transformation codes. Hub targets use monthly log differences
  for INDPRO/CPIAUCSL/PCEPI and first differences for UNRATE. Forecast all variables for 24 months, then
  extract the four hub targets; five quantiles from 128 predictive samples, seed 0. The 24-month horizon
  fits one output patch, so its predictive distribution is computed once and reused for all samples. No
  mean rows are submitted. Isolated missing level months are forward-filled; other auxiliary missing values
  are masked. Historical forecasts use revised observations and may overlap model pretraining; they are
  retrospective comparisons.
data_inputs: Full FRED-MD monthly panel (126 variables); four hub targets extracted after forecasting
