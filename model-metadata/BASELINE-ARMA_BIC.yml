team_name: Baseline Models
team_abbr: BASELINE
model_name: ARMA with BIC Lag Selection
model_abbr: ARMA_BIC
model_version: "1.1"
model_contributors:
  - name: Sicco Kooiker
    affiliation: SBE EDS - Machine Learning in Macroeconomics
    email: macro-forecast-hub@example.org
team_model_designation: primary
methods: >-
  Univariate ARMA model for each target. Lag orders (p, q) selected by
  minimizing the Bayesian Information Criterion over a grid search.
  Quantile forecasts from Gaussian predictive distribution.
methods_long: >-
  For each target indicator, we fit a univariate ARMA(p,q) model where the
  lag orders p and q are selected by minimizing the Bayesian Information
  Criterion (BIC) over p in {0,...,6} and q in {0,...,4}. The model is
  estimated on standardized monthly log differences (INDPRO, CPIAUCSL,
  PCEPI) or first differences (UNRATE), using up to 120 monthly levels.
  State-space maximum likelihood fits must converge and satisfy stationarity
  and invertibility. Historical backfills select orders annually and refit
  coefficients at each monthly origin, reselecting if a fit fails.
  Quantiles use the Gaussian predictive distribution and its horizon-specific
  forecast-error variance, transformed back to monthly change units without
  rounding or clipping. Isolated missing levels are forward-filled before
  differencing. Historical runs use revised observations, not release vintages.
data_inputs: FRED-MD monthly dataset (target indicators only)
