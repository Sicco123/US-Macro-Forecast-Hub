name: Generate Baseline Forecast

on:
  # The 17th is the monthly forecast origin; 06:00 UTC is 01:00-02:00 US/Eastern,
  # inside the submission window.
  schedule:
    - cron: '0 6 17 * *'
  workflow_dispatch:

# Every workflow that commits to main shares this group, so their pushes queue.
concurrency:
  group: commit-to-main
  cancel-in-progress: false

jobs:
  baseline:
    runs-on: ubuntu-latest
    permissions:
      contents: write

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'
          cache: 'pip'

      - name: Install dependencies
        run: pip install pandas numpy

      - name: Generate baseline forecast
        run: python src/models/baseline.py

      - name: Commit and push forecasts
        run: |
          git add model-output/MacroHub-RandomWalk/
          if git diff --cached --quiet; then echo "No changes."; exit 0; fi
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git commit -m "Generate RandomWalk baseline forecast $(date +%Y-%m-%d)"
          git pull --rebase
          git push
